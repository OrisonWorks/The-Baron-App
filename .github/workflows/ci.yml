name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend-app

      - name: Run tests
        run: npm test -- --passWithNoTests
        working-directory: backend-app

      - name: Build
        run: npm run build
        working-directory: backend-app

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/frontend-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend/frontend-app

      - name: Run tests
        run: npm test -- --watchAll=false --passWithNoTests
        working-directory: frontend/frontend-app
        env:
          CI: true

      - name: Build
        run: npm run build
        working-directory: frontend/frontend-app
        env:
          CI: false
